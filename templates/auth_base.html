{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · MIU-LRSES</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h1>MIU Lecture Reminder and Student Engagement System</h1>
      <p>Metropolitan International University, Mbarara Campus (Biharwe)</p>
    </div>
    <div class="panel rounded-top-0 border-top-0">
      <div class="panel-body p-4">
        {% include "partials/_messages.html" %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
