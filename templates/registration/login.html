{% extends "auth_base.html" %}
{% block content %}
<h2 class="h5 mb-3">Sign in</h2>
<form method="post" class="styled-form" novalidate>{% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
  <div class="mb-3">
    <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
    {{ form.username }}
  </div>
  <div class="mb-3">
    <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
<p class="mt-3 mb-0 small"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
{% endblock %}
