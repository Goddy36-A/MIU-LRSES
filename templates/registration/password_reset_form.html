{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h2 class="h5 mb-3">Reset your password</h2>
<p class="text-secondary">Enter the email address on your account. If it matches, a reset link is sent.</p>
<form method="post" class="styled-form" novalidate>{% csrf_token %}
  {% include "partials/_form_fields.html" %}
  <button class="btn btn-primary w-100" type="submit">Send reset link</button>
</form>
<p class="mt-3 mb-0 small"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
{% endblock %}
